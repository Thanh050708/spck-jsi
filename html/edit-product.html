<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa sản phẩm</title>
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <header class="my-4">
        <h1><i class="fas fa-pencil-alt"></i> Sửa sản phẩm</h1>
        <p>Điền thông tin và nhấn Lưu để cập nhật sản phẩm.</p>
        <div id="greeting">
          <span id="display-name"></span>
          <button id="btn-logout" class="btn btn-danger">Đăng xuất</button>
        </div>
        <a href="./login.html" id="btn-login">
          <button class="btn btn-primary">Đăng nhập</button>
        </a>
      </header>

      <section class="bg-white p-5 rounded shadow-sm">
        <form id="edit-product-form" class="row g-4">
          <div class="col-md-6">
            <label for="name" class="form-label">Tên sản phẩm</label>
            <input id="name" name="name" type="text" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="price" class="form-label">Giá</label>
            <input id="price" name="price" type="number" class="form-control" required />
          </div>
          <div class="col-12">
            <label for="image" class="form-label">URL ảnh</label>
            <input id="image" name="image" type="url" class="form-control" required />
          </div>
          <div class="col-12">
            <label for="description" class="form-label">Mô tả</label>
            <textarea id="description" name="description" class="form-control" rows="5"></textarea>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-success">Lưu thay đổi</button>
            <a id="btn-cancel" href="./product-detail.html" class="btn btn-outline-secondary">Hủy</a>
          </div>
        </form>
        <div id="edit-error" class="alert alert-warning d-none mt-4" role="alert"></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script defer src="../firebase.config.js"></script>
    <script defer src="../js/check-login.js"></script>
    <script defer src="../js/edit-product.js"></script>
  </body>
</html>
